name: Temporary Lockfile Repair

on:
  push:
    branches:
      - cleanup/repository-remediation

permissions:
  contents: write
  actions: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git commit -m "fix: regenerate npm lockfile after dependency cleanup"
          git push origin HEAD:cleanup/repository-remediation
