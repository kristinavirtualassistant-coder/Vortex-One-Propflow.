name: Temporary Lockfile Repair

on:
  push:
    branches:
      - cleanup/repository-remediation

permissions:
  contents: read
  actions: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: vortex-one-package-lock
          path: package-lock.json
          if-no-files-found: error
