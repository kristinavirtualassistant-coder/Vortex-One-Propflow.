name: Temporary Dependency Audit

on:
  push:
    branches:
      - cleanup/repository-remediation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=moderate || true
