<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Vortex One | Property intelligence, CRM and dialer</title>
    <meta
      name="description"
      content="Vortex One combines property and owner intelligence, lead scoring, CRM, a power dialer and workflow automation in one workspace."
    />
    <meta name="theme-color" content="#0b1120" />

    <!-- Open Graph / social sharing. %SITE_URL% is replaced at build time (see vite.config.ts).
         og:url and canonical are intentionally omitted: this is a single-page app that serves
         one HTML file for every route, so a fixed URL would point shared legal pages at the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vortex One" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Vortex One | Property intelligence, CRM and dialer" />
    <meta
      property="og:description"
      content="Find the right property, know the owner, reach them and close the loop. Property intelligence, lead scoring, CRM and a power dialer in one workspace."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vortex One logo with the line: Find the property. Know the owner. Close the loop." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vortex One | Property intelligence, CRM and dialer" />
    <meta
      name="twitter:description"
      content="Find the right property, know the owner, reach them and close the loop. Property intelligence, lead scoring, CRM and a power dialer in one workspace."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Vortex One logo with the line: Find the property. Know the owner. Close the loop." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
